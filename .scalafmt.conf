version = 3.11.5

runner.dialect = scala212

fileOverride {
  "glob:**/src/{main,test}/scala-2.12/**" { runner.dialect = scala212source3 }
  "glob:**/src/{main,test}/scala-2.13/**" { runner.dialect = scala213 }
  "glob:**/src/{main,test}/scala-3/**" { runner.dialect = scala33 }
  "glob:**/examples/src/{main,test}/scala/**" { runner.dialect = scala33 }
  "glob:**/*.sbt" { runner.dialect = sbt1 }
  "glob:**/project/**.scala" { runner.dialect = scala212 }
}

style = default

maxColumn = 120

docstrings.wrap = yes
docstrings.wrapMaxColumn = 80

align.preset = none

danglingParentheses.preset = true

rewrite.rules = [
  AvoidInfix
  RedundantBraces
  RedundantParens
  PreferCurlyFors
  SortModifiers
]

rewrite.sortModifiers.order = [
  override, implicit, private, protected, final, sealed, abstract, lazy
]

rewrite.trailingCommas.style = multiple

